# Builds Hydra Mixer Potato on a Windows machine of GitHub, runs the tests and makes the installer and the portable zip.
# Start it by hand: Actions -> "Windows build and installer" -> Run workflow. The files are in the "Artifacts" of the run.
# Pushing a tag like v0.6.1 also attaches them to a GitHub release.
#
# No Git needed: if a file "Hydra-Mixer-....zip" (the complete sources) was uploaded to the root of the repository with
# the web page of GitHub, its files REPLACE the sources before the build: files of the zip are copied over the repository
# and files that the zip does not have are removed. .git, .github and the JUCE folder are never touched. The step stops
# (and changes nothing) if the zip would remove files, which means it is older than the repository, for example a fork
# with newer files than the zip. Tick "Replace even if files are removed" only if the zip is meant to remove them.
name: Windows build and installer

on:
  workflow_dispatch:
    inputs:
      force_replace:
        description: "Replace even if files are removed (only when the uploaded zip is meant to remove them)"
        type: boolean
        default: false
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Get the sources (with the JUCE submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check that JUCE is there
        run: |
          if (-not (Test-Path "external/JUCE/CMakeLists.txt")) {
            throw "external/JUCE is empty. This repository must be a fork / clone of TicT4x/Hydra-Mixer (the JUCE submodule is part of it), or add JUCE: git submodule add https://github.com/juce-framework/JUCE external/JUCE"
          }

      - name: Set up Python (for the zip step)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Replace the sources with an uploaded zip (only if there is one)
        shell: bash
        env:
          FORCE_REPLACE: ${{ inputs.force_replace }}
        run: |
          python - <<'PY'
          """Replaces the sources of the repository with the files of an uploaded zip (Hydra-Mixer-*.zip in the repository root).

          The tree is REPLACED, not overlaid: files of the zip are copied over the repository, files that the zip does not have
          are removed. Never touched: .git, .github and external/JUCE (the submodule). Because replacing is destructive, the
          step stops if the zip would remove files of the repository (the zip is then older than the repository, for example
          a fork that has newer files than the zip) unless FORCE_REPLACE is "true".
          """
          import filecmp
          import glob
          import os
          import shutil
          import sys
          import tempfile
          import zipfile
          from pathlib import Path

          PROTECTED = (".git", ".github", "external/JUCE")
          repo = Path(os.environ.get("REPO_DIR", ".")).resolve()
          force = os.environ.get("FORCE_REPLACE", "").strip().lower() in ("true", "1", "yes")


          def protected(rel: str) -> bool:
              return any(rel == p or rel.startswith(p + "/") for p in PROTECTED)


          def files_under(root: Path, skip_zips: bool):
              out = {}
              for dirpath, dirnames, filenames in os.walk(root):
                  here = Path(dirpath).relative_to(root).as_posix()
                  prefix = "" if here == "." else here + "/"
                  dirnames[:] = [d for d in dirnames if d != "__MACOSX" and not protected(prefix + d)]   # do not walk into JUCE
                  for name in filenames:
                      rel = prefix + name
                      if skip_zips and "/" not in rel and rel.startswith("Hydra-Mixer-") and rel.endswith(".zip"):
                          continue
                      out[rel] = Path(dirpath) / name
              return out


          def main() -> int:
              zips = sorted(glob.glob(str(repo / "Hydra-Mixer-*.zip")))
              if not zips:
                  print("No Hydra-Mixer-*.zip in the repository: the sources are built as they are.")
                  return 0
              if len(zips) > 1:
                  print("::error::There are several zips in the repository root: " + ", ".join(Path(z).name for z in zips))
                  print("Delete the ones you do not want (GitHub: open the file, then the trash can) and run again.")
                  return 1
              zpath = Path(zips[0])
              print(f"Replacing the sources with {zpath.name}" + (" (force)" if force else ""))

              tmp = Path(tempfile.mkdtemp(prefix="hydra-zip-"))
              try:
                  with zipfile.ZipFile(zpath) as z:
                      if z.testzip() is not None:
                          print("::error::The zip is damaged.")
                          return 1
                      z.extractall(tmp)
                  entries = [e for e in tmp.iterdir() if e.name != "__MACOSX"]
                  root = entries[0] if len(entries) == 1 and entries[0].is_dir() else tmp
                  if not (root / "CMakeLists.txt").is_file() or not (root / "src").is_dir():
                      print("::error::This zip does not hold the sources (no CMakeLists.txt and src/ at its top).")
                      return 1

                  new = files_under(root, skip_zips=False)
                  old = files_under(repo, skip_zips=True)
                  removed = sorted(set(old) - set(new))
                  added = sorted(set(new) - set(old))
                  changed = sorted(r for r in set(new) & set(old) if not filecmp.cmp(new[r], old[r], shallow=False))

                  print(f"The zip has {len(new)} files: {len(added)} new, {len(changed)} different, {len(new) - len(added) - len(changed)} identical.")
                  if removed:
                      shown = ", ".join(removed[:25]) + (f" ... (+{len(removed) - 25} more)" if len(removed) > 25 else "")
                      if not force:
                          print(f"::error::The zip would remove {len(removed)} files of the repository: {shown}")
                          print("The zip looks older than the repository (or is only a part of it). Nothing was changed.")
                          print("Send the current sources of the repository so the changes can be merged into them, or, if the removal")
                          print("is meant, run the workflow again with \"Replace even if files are removed\" ticked.")
                          return 1
                      print(f"Removing {len(removed)} files that are not in the zip: {shown}")
                      for rel in removed:
                          old[rel].unlink()

                  for rel in added + changed:
                      dest = repo / rel
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(new[rel], dest)

                  # Empty folders left behind by removed files.
                  for d in sorted((p for p in repo.rglob("*") if p.is_dir()), key=lambda p: len(p.parts), reverse=True):
                      rel = d.relative_to(repo).as_posix()
                      if not protected(rel) and not any(d.iterdir()):
                          d.rmdir()
                  print("Done. Changed files: " + (", ".join(changed[:15]) + (" ..." if len(changed) > 15 else "") if changed else "none"))
                  return 0
              finally:
                  shutil.rmtree(tmp, ignore_errors=True)


          if __name__ == "__main__":
              sys.exit(main())
          PY

      - name: Set up the Visual C++ tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Make sure Ninja is available
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          ninja --version

      - name: Build (Release)
        run: |
          cmake -S . -B build/Release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/Release -- -k 0

      - name: Tests
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $tests = "build/Release/HydraTests_artefacts/Release/HydraTests.exe"
          & $tests *> test-log.txt
          $code = $LASTEXITCODE
          Get-Content test-log.txt -Tail 60
          exit $code

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Make the installer and the portable zip
        run: |
          $exe = (Resolve-Path "build/Release/HydraMixer_artefacts/Release/Hydra Mixer Potato.exe").Path
          $version = "0.6.0"
          if ((Get-Content CMakeLists.txt -Raw) -match 'project\(HydraMixer VERSION ([0-9][0-9.]*)') { $version = $Matches[1] }
          New-Item -ItemType Directory -Force installer/Output | Out-Null
          Compress-Archive -Path $exe, LICENSE, README.md -DestinationPath "installer/Output/HydraMixerPotato-$version-win64.zip"
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          $isccArgs = @("/DAppVersion=$version", "/DBuildDir=$(Split-Path -Parent $exe)")
          $ico = "build/Release/HydraMixer_artefacts/JuceLibraryCode/icon.ico"
          if (Test-Path $ico) { $isccArgs += "/DIconFile=$((Resolve-Path $ico).Path)" }
          & $iscc @isccArgs installer/HydraMixer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem installer/Output

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: HydraMixerPotato-Windows
          path: |
            installer/Output/*.exe
            installer/Output/*.zip
            test-log.txt
          if-no-files-found: warn

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/*.exe
            installer/Output/*.zip
